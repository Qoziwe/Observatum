<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatum — Admin Login</title>
    <link rel="stylesheet" href="/static/css/brutalist.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <span class="sdg-badge">UN SDG 9</span>
            <span>Observatum • Kuala Lumpur Connectivity Research</span>
        </div>
        <div class="topbar-actions">
            <a href="/" class="btn-brutal btn-secondary">← Survey Form</a>
            
        </div>
    </header>

    <main class="shell" style="max-width: 460px; margin-top: 80px;">
        <section class="monolith-header" style="padding: 36px 32px;">
            <div class="monolith-meta-row">
                <span>APU SDG 9 Research</span>
                <span>Protected Dashboard</span>
            </div>
            <h1 class="monolith-title" style="font-size: 1.75rem; margin-bottom: 10px;">Admin Dashboard</h1>
            <p class="monolith-desc" style="font-size: 0.92rem; margin-bottom: 24px;">
                Enter the administrator password to access real-time survey analytics and telemetry charts.
            </p>

            {% if error %}
            <div class="gate-alert" style="display: block; margin-bottom: 20px;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <div class="q-head">
                        <span class="q-num">Password</span>
                        <span class="q-req">Required</span>
                    </div>
                    <input
                        type="password"
                        name="password"
                        class="text-input"
                        placeholder="Enter admin password..."
                        required
                        autofocus
                    >
                </div>
                <button type="submit" class="btn-brutal" style="width: 100%;">Unlock Dashboard →</button>
            </form>
        </section>
    </main>

    <script>
        (function() {
            const saved = localStorage.getItem("observatum_bento_theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
            const btn = document.getElementById("themeBtn");
            btn.textContent = saved === "dark" ? "Theme: Dark" : "Theme: Light";
            btn.addEventListener("click", function() {
                const cur = document.documentElement.getAttribute("data-theme");
                const next = cur === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("observatum_bento_theme", next);
                btn.textContent = next === "dark" ? "Theme: Dark" : "Theme: Light";
            });
        })();
    </script>
</body>
</html>
